[project]
name = "pdf-form-filler"
version = "0.1.0"
description = "GUI software for filling PDF forms from a hierarchical data file, using openJiuwen agent-core."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openjiuwen",
    "pyside6>=6.6",
    "qasync>=0.27",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdffiller"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
